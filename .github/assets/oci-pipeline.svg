<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="OpenCodeIntel semantic search pipeline: query becomes embeddings, embeddings find matches in a semantic graph, top results rank by similarity">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="pillStroke" x1="0" x2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" x2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="hitGlow">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- typing reveal for the code query -->
    <clipPath id="typeQuery">
      <rect x="36" y="148" width="0" height="20">
        <animate attributeName="width" begin="0.4s" dur="1.0s" from="0" to="200" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- typing reveal for results -->
    <clipPath id="r1"><rect x="640" y="138" width="0" height="22">
      <animate attributeName="width" begin="6.6s" dur="0.6s" from="0" to="240" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="r2"><rect x="640" y="180" width="0" height="22">
      <animate attributeName="width" begin="7.2s" dur="0.6s" from="0" to="240" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="r3"><rect x="640" y="222" width="0" height="22">
      <animate attributeName="width" begin="7.8s" dur="0.6s" from="0" to="240" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <rect width="900" height="360" rx="16" fill="#020617"/>
  <rect width="900" height="360" rx="16" fill="url(#bg)"/>

  <!-- top: system-properties pills (DDIA flavor) -->
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="10.5" letter-spacing="0.5">
    <g transform="translate(36 30)">
      <rect width="118" height="22" rx="11" fill="none" stroke="url(#pillStroke)" stroke-width="0.8"/>
      <text x="59" y="15" text-anchor="middle" fill="#cbd5e1">p99 &lt; 80ms</text>
    </g>
    <g transform="translate(166 30)">
      <rect width="118" height="22" rx="11" fill="none" stroke="url(#pillStroke)" stroke-width="0.8"/>
      <text x="59" y="15" text-anchor="middle" fill="#cbd5e1">87.5% Hit@1</text>
    </g>
    <g transform="translate(296 30)">
      <rect width="138" height="22" rx="11" fill="none" stroke="url(#pillStroke)" stroke-width="0.8"/>
      <text x="69" y="15" text-anchor="middle" fill="#cbd5e1">eventually consistent</text>
    </g>
    <g transform="translate(446 30)">
      <rect width="118" height="22" rx="11" fill="none" stroke="url(#pillStroke)" stroke-width="0.8"/>
      <text x="59" y="15" text-anchor="middle" fill="#cbd5e1">MCP-native</text>
    </g>

    <text x="864" y="44" text-anchor="end" fill="#64748b" letter-spacing="2.2">OPENCODEINTEL  ·  SEMANTIC  CONTEXT</text>
  </g>

  <!-- stage labels -->
  <g font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10" fill="#64748b" letter-spacing="2.5" font-weight="500">
    <text x="36"  y="98">QUERY</text>
    <text x="350" y="98">SEMANTIC GRAPH</text>
    <text x="640" y="98">TOP MATCHES</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#334155" stroke-width="1" fill="none">
    <line x1="260" y1="200" x2="290" y2="200"/>
    <polygon points="290,200 284,196 284,204" fill="#334155" stroke="none"/>
    <line x1="600" y1="200" x2="630" y2="200"/>
    <polygon points="630,200 624,196 624,204" fill="#334155" stroke="none"/>
  </g>

  <!-- ============== STAGE 1: code editor with query ============== -->
  <g transform="translate(20 110)">
    <rect width="240" height="180" rx="8" fill="#0a0a14" stroke="#1e293b" stroke-width="1"/>
    <!-- chrome -->
    <rect width="240" height="22" rx="8" fill="#111827"/>
    <rect y="14" width="240" height="8" fill="#111827"/>
    <circle cx="12" cy="11" r="3" fill="#ef4444"/>
    <circle cx="24" cy="11" r="3" fill="#eab308"/>
    <circle cx="36" cy="11" r="3" fill="#22c55e"/>
    <text x="120" y="15" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">user_service.ts</text>

    <!-- code lines -->
    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="11">
      <text x="14" y="44" fill="#475569">1</text>
      <text x="32" y="44" fill="#94a3b8">export</text>
      <text x="78" y="44" fill="#a78bfa">async</text>
      <text x="116" y="44" fill="#60a5fa">function</text>
      <text x="14" y="62" fill="#475569">2</text>
      <text x="42" y="62" fill="#fbbf24">getUserContext</text>
      <text x="138" y="62" fill="#cbd5e1">(id) {</text>
      <text x="14" y="80" fill="#475569">3</text>
      <text x="42" y="80" fill="#94a3b8">return</text>
      <text x="86" y="80" fill="#a78bfa">await</text>
      <text x="124" y="80" fill="#cbd5e1">db.find()</text>
      <text x="14" y="98" fill="#475569">4</text>
      <text x="32" y="98" fill="#cbd5e1">}</text>

      <!-- query prompt -->
      <line x1="14" y1="118" x2="226" y2="118" stroke="#1e293b" stroke-width="0.8"/>
      <text x="14" y="138" fill="#22c55e">$</text>
      <text x="28" y="138" fill="#94a3b8">find context</text>
      <g clip-path="url(#typeQuery)">
        <text x="22" y="162" fill="#fbbf24">getUserContext usages</text>
      </g>
      <!-- query cursor -->
      <rect x="22" y="148" width="6" height="14" fill="#fbbf24" opacity="0">
        <animate attributeName="opacity" begin="0s" dur="0.4s" values="0;1" fill="freeze"/>
        <animate attributeName="opacity" begin="0.4s" values="0.2;1;0.2" dur="0.6s" repeatCount="3"/>
        <animate attributeName="opacity" begin="1.4s" dur="0.05s" values="0;0" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- ============== STAGE 2: semantic graph ============== -->
  <g transform="translate(290 110)">
    <!-- query vector center, appears after typing -->
    <g opacity="0">
      <animate attributeName="opacity" begin="1.6s" dur="0.4s" from="0" to="1" fill="freeze"/>
      <circle cx="155" cy="90" r="14" fill="url(#hot)" opacity="0.35"/>
      <circle cx="155" cy="90" r="6" fill="url(#hot)"/>
      <circle cx="155" cy="90" r="6" fill="none" stroke="#f472b6" stroke-width="1">
        <animate attributeName="r" values="6;26;6" dur="2.4s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <text x="155" y="58" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#f472b6" letter-spacing="0.5">QUERY</text>
    </g>

    <!-- candidate nodes -->
    <g font-family="ui-monospace, monospace" font-size="8" fill="#475569">
      <!-- Each candidate fades in then either dims (low sim) or lights up (top match) -->

      <!-- top match 1 (closest) -->
      <g opacity="0">
        <animate attributeName="opacity" begin="2.2s" dur="0.4s" from="0" to="1" fill="freeze"/>
        <line x1="155" y1="90" x2="80" y2="60" stroke="#fbbf24" stroke-width="0.5" opacity="0">
          <animate attributeName="opacity" begin="3.6s" dur="0.6s" from="0" to="0.8" fill="freeze"/>
          <animate attributeName="stroke-width" begin="5.5s" dur="0.4s" from="0.5" to="1.5" fill="freeze"/>
        </line>
        <circle cx="80" cy="60" r="4" fill="#475569">
          <animate attributeName="fill" begin="5.5s" dur="0.4s" to="#fbbf24" fill="freeze"/>
          <animate attributeName="r" begin="5.5s" dur="0.4s" to="6" fill="freeze"/>
        </circle>
        <circle cx="80" cy="60" r="0" fill="url(#hitGlow)">
          <animate attributeName="r" begin="5.5s" dur="0.6s" to="20" fill="freeze"/>
        </circle>
      </g>

      <!-- top match 2 -->
      <g opacity="0">
        <animate attributeName="opacity" begin="2.4s" dur="0.4s" from="0" to="1" fill="freeze"/>
        <line x1="155" y1="90" x2="225" y2="55" stroke="#fbbf24" stroke-width="0.5" opacity="0">
          <animate attributeName="opacity" begin="3.8s" dur="0.6s" from="0" to="0.7" fill="freeze"/>
          <animate attributeName="stroke-width" begin="5.7s" dur="0.4s" from="0.5" to="1.3" fill="freeze"/>
        </line>
        <circle cx="225" cy="55" r="4" fill="#475569">
          <animate attributeName="fill" begin="5.7s" dur="0.4s" to="#fbbf24" fill="freeze"/>
          <animate attributeName="r" begin="5.7s" dur="0.4s" to="5.5" fill="freeze"/>
        </circle>
        <circle cx="225" cy="55" r="0" fill="url(#hitGlow)">
          <animate attributeName="r" begin="5.7s" dur="0.6s" to="18" fill="freeze"/>
        </circle>
      </g>

      <!-- top match 3 -->
      <g opacity="0">
        <animate attributeName="opacity" begin="2.6s" dur="0.4s" from="0" to="1" fill="freeze"/>
        <line x1="155" y1="90" x2="60" y2="135" stroke="#fbbf24" stroke-width="0.5" opacity="0">
          <animate attributeName="opacity" begin="4.0s" dur="0.6s" from="0" to="0.6" fill="freeze"/>
          <animate attributeName="stroke-width" begin="5.9s" dur="0.4s" from="0.5" to="1.2" fill="freeze"/>
        </line>
        <circle cx="60" cy="135" r="4" fill="#475569">
          <animate attributeName="fill" begin="5.9s" dur="0.4s" to="#fbbf24" fill="freeze"/>
          <animate attributeName="r" begin="5.9s" dur="0.4s" to="5" fill="freeze"/>
        </circle>
        <circle cx="60" cy="135" r="0" fill="url(#hitGlow)">
          <animate attributeName="r" begin="5.9s" dur="0.6s" to="16" fill="freeze"/>
        </circle>
      </g>

      <!-- low-similarity scatter (dim, never light up) -->
      <g>
        <line x1="155" y1="90" x2="270" y2="120" stroke="#1e293b" stroke-width="0.5" opacity="0">
          <animate attributeName="opacity" begin="4.2s" dur="0.6s" from="0" to="0.5" fill="freeze"/>
        </line>
        <line x1="155" y1="90" x2="40"  y2="105" stroke="#1e293b" stroke-width="0.5" opacity="0">
          <animate attributeName="opacity" begin="4.4s" dur="0.6s" from="0" to="0.5" fill="freeze"/>
        </line>
        <line x1="155" y1="90" x2="120" y2="170" stroke="#1e293b" stroke-width="0.5" opacity="0">
          <animate attributeName="opacity" begin="4.6s" dur="0.6s" from="0" to="0.4" fill="freeze"/>
        </line>
        <line x1="155" y1="90" x2="200" y2="145" stroke="#1e293b" stroke-width="0.5" opacity="0">
          <animate attributeName="opacity" begin="4.8s" dur="0.6s" from="0" to="0.4" fill="freeze"/>
        </line>
        <line x1="155" y1="90" x2="245" y2="155" stroke="#1e293b" stroke-width="0.5" opacity="0">
          <animate attributeName="opacity" begin="5.0s" dur="0.6s" from="0" to="0.3" fill="freeze"/>
        </line>

        <circle cx="270" cy="120" r="3" fill="#334155" opacity="0"><animate attributeName="opacity" begin="2.8s" dur="0.4s" from="0" to="0.7" fill="freeze"/></circle>
        <circle cx="40"  cy="105" r="3" fill="#334155" opacity="0"><animate attributeName="opacity" begin="3.0s" dur="0.4s" from="0" to="0.7" fill="freeze"/></circle>
        <circle cx="120" cy="170" r="3" fill="#334155" opacity="0"><animate attributeName="opacity" begin="3.2s" dur="0.4s" from="0" to="0.7" fill="freeze"/></circle>
        <circle cx="200" cy="145" r="3" fill="#334155" opacity="0"><animate attributeName="opacity" begin="3.4s" dur="0.4s" from="0" to="0.7" fill="freeze"/></circle>
        <circle cx="245" cy="155" r="3" fill="#334155" opacity="0"><animate attributeName="opacity" begin="3.6s" dur="0.4s" from="0" to="0.7" fill="freeze"/></circle>
        <circle cx="295" cy="80"  r="3" fill="#334155" opacity="0"><animate attributeName="opacity" begin="3.8s" dur="0.4s" from="0" to="0.7" fill="freeze"/></circle>
        <circle cx="20"  cy="155" r="3" fill="#334155" opacity="0"><animate attributeName="opacity" begin="4.0s" dur="0.4s" from="0" to="0.7" fill="freeze"/></circle>
      </g>
    </g>
  </g>

  <!-- ============== STAGE 3: ranked results ============== -->
  <g transform="translate(630 110)">
    <!-- result 1 -->
    <g>
      <rect x="0" y="20" width="250" height="34" rx="6" fill="#0a0a14" stroke="#1e293b" opacity="0">
        <animate attributeName="opacity" begin="6.6s" dur="0.4s" from="0" to="1" fill="freeze"/>
        <animate attributeName="stroke" begin="6.6s" dur="0.01s" to="#fbbf24" fill="freeze"/>
      </rect>
      <g clip-path="url(#r1)">
        <text x="10" y="42" font-family="ui-monospace, monospace" font-size="11" fill="#fbbf24">0.97</text>
        <text x="50" y="42" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">user_service.ts:142</text>
      </g>
    </g>

    <!-- result 2 -->
    <g>
      <rect x="0" y="62" width="250" height="34" rx="6" fill="#0a0a14" stroke="#1e293b" opacity="0">
        <animate attributeName="opacity" begin="7.2s" dur="0.4s" from="0" to="1" fill="freeze"/>
      </rect>
      <g clip-path="url(#r2)">
        <text x="10" y="84" font-family="ui-monospace, monospace" font-size="11" fill="#fbbf24">0.91</text>
        <text x="50" y="84" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">api/user.ts:58</text>
      </g>
    </g>

    <!-- result 3 -->
    <g>
      <rect x="0" y="104" width="250" height="34" rx="6" fill="#0a0a14" stroke="#1e293b" opacity="0">
        <animate attributeName="opacity" begin="7.8s" dur="0.4s" from="0" to="1" fill="freeze"/>
      </rect>
      <g clip-path="url(#r3)">
        <text x="10" y="126" font-family="ui-monospace, monospace" font-size="11" fill="#fbbf24">0.84</text>
        <text x="50" y="126" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">context/index.ts:23</text>
      </g>
    </g>

    <!-- summary line -->
    <text x="0" y="172" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b" letter-spacing="2" opacity="0">
      <animate attributeName="opacity" begin="8.4s" dur="0.6s" from="0" to="1" fill="freeze"/>
      3 OF 12,847 CHUNKS  ·  RETURNED IN 38ms
    </text>
  </g>

  <!-- caption at bottom -->
  <text x="450" y="338" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569" letter-spacing="1">
    how OpenCodeIntel turns intent into context · live demo loops above
  </text>
</svg>
