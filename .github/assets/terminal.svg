<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-label="terminal showing manifesto in Devanshu's voice">
  <defs>
    <linearGradient id="titlebar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Each clipPath is a rect that grows from width 0 to a target width, revealing the
         text underneath. Sequential begin times produce the cascading typewriter effect. -->
    <clipPath id="t1"><rect x="24" y="62" height="22" width="0">
      <animate attributeName="width" begin="0s"   dur="0.5s" from="0" to="100" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="24" y="90" height="22" width="0">
      <animate attributeName="width" begin="0.7s" dur="1.4s" from="0" to="500" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="24" y="128" height="22" width="0">
      <animate attributeName="width" begin="2.4s" dur="0.6s" from="0" to="170" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="t4"><rect x="24" y="156" height="22" width="0">
      <animate attributeName="width" begin="3.2s" dur="1.6s" from="0" to="560" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="t5"><rect x="24" y="184" height="22" width="0">
      <animate attributeName="width" begin="5.0s" dur="1.4s" from="0" to="430" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="t6"><rect x="24" y="222" height="22" width="0">
      <animate attributeName="width" begin="6.6s" dur="0.6s" from="0" to="160" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="t7"><rect x="24" y="250" height="22" width="0">
      <animate attributeName="width" begin="7.4s" dur="1.6s" from="0" to="540" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <!-- window chrome -->
  <rect width="900" height="280" rx="12" fill="#0a0a12"/>
  <rect width="900" height="36" rx="12" fill="url(#titlebar)"/>
  <rect y="24" width="900" height="12" fill="url(#titlebar)"/>

  <!-- traffic lights -->
  <circle cx="22" cy="18" r="6" fill="#ef4444"/>
  <circle cx="44" cy="18" r="6" fill="#eab308"/>
  <circle cx="66" cy="18" r="6" fill="#22c55e"/>

  <!-- titlebar text -->
  <text x="450" y="22" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace"
        font-size="12" fill="#94a3b8" letter-spacing="0.5">
    devanshu — zsh
  </text>

  <!-- terminal body -->
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="14">

    <!-- line 1: $ whoami -->
    <g clip-path="url(#t1)">
      <text x="24" y="78" fill="#22c55e">$</text>
      <text x="42" y="78" fill="#e2e8f0">whoami</text>
    </g>

    <!-- line 2: response -->
    <g clip-path="url(#t2)">
      <text x="24" y="106" fill="#94a3b8">devanshu chicholikar · ms northeastern '26 · boston</text>
    </g>

    <!-- line 3: $ cat ~/manifesto -->
    <g clip-path="url(#t3)">
      <text x="24" y="144" fill="#22c55e">$</text>
      <text x="42" y="144" fill="#e2e8f0">cat ~/manifesto</text>
    </g>

    <!-- line 4: response -->
    <g clip-path="url(#t4)">
      <text x="24" y="172" fill="#cbd5e1">building the context layer AI coding tools forgot to build.</text>
    </g>

    <!-- line 5: response (manifesto cont) -->
    <g clip-path="url(#t5)">
      <text x="24" y="200" fill="#cbd5e1">because someone has to. and i can't not.</text>
    </g>

    <!-- line 6: $ status -->
    <g clip-path="url(#t6)">
      <text x="24" y="238" fill="#22c55e">$</text>
      <text x="42" y="238" fill="#e2e8f0">status --now</text>
    </g>

    <!-- line 7: response -->
    <g clip-path="url(#t7)">
      <text x="24" y="266" fill="#94a3b8">available may 2026 · looking for a team that ships hard.</text>
    </g>
  </g>

  <!-- blinking cursor, hidden until typing finishes -->
  <rect x="568" y="252" width="9" height="18" fill="#22c55e" opacity="0">
    <animate attributeName="opacity" begin="9.0s" values="0;1" dur="0.01s" fill="freeze"/>
    <animate attributeName="opacity" begin="9.0s" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
