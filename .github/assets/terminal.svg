<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="terminal showing identity, values, stack, and looking-for">
  <defs>
    <linearGradient id="titlebar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Each clipPath grows from width 0 to a target width, revealing text underneath.
         Sequential begin times produce the cascading typewriter effect. -->
    <clipPath id="t1"><rect x="24" y="62" height="22" width="0">
      <animate attributeName="width" begin="0s"   dur="0.5s" from="0" to="100" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="24" y="90" height="22" width="0">
      <animate attributeName="width" begin="0.7s" dur="1.4s" from="0" to="540" fill="freeze"/>
    </rect></clipPath>

    <clipPath id="t3"><rect x="24" y="128" height="22" width="0">
      <animate attributeName="width" begin="2.4s" dur="0.5s" from="0" to="90" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="t4"><rect x="24" y="156" height="22" width="0">
      <animate attributeName="width" begin="3.0s" dur="1.6s" from="0" to="600" fill="freeze"/>
    </rect></clipPath>

    <clipPath id="t5"><rect x="24" y="194" height="22" width="0">
      <animate attributeName="width" begin="4.8s" dur="0.5s" from="0" to="80" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="t6"><rect x="24" y="222" height="22" width="0">
      <animate attributeName="width" begin="5.4s" dur="1.6s" from="0" to="640" fill="freeze"/>
    </rect></clipPath>

    <clipPath id="t7"><rect x="24" y="260" height="22" width="0">
      <animate attributeName="width" begin="7.2s" dur="0.6s" from="0" to="160" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="t8"><rect x="24" y="288" height="22" width="0">
      <animate attributeName="width" begin="7.9s" dur="1.6s" from="0" to="640" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <!-- window chrome -->
  <rect width="900" height="320" rx="12" fill="#0a0a12"/>
  <rect width="900" height="36" rx="12" fill="url(#titlebar)"/>
  <rect y="24" width="900" height="12" fill="url(#titlebar)"/>

  <circle cx="22" cy="18" r="6" fill="#ef4444"/>
  <circle cx="44" cy="18" r="6" fill="#eab308"/>
  <circle cx="66" cy="18" r="6" fill="#22c55e"/>

  <text x="450" y="22" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace"
        font-size="12" fill="#94a3b8" letter-spacing="0.5">
    devanshu — zsh
  </text>

  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="14">

    <!-- $ whoami -->
    <g clip-path="url(#t1)">
      <text x="24" y="78" fill="#22c55e">$</text>
      <text x="42" y="78" fill="#e2e8f0">whoami</text>
    </g>
    <g clip-path="url(#t2)">
      <text x="24" y="106" fill="#cbd5e1">devanshu chicholikar · ms northeastern '26 · boston</text>
    </g>

    <!-- $ values -->
    <g clip-path="url(#t3)">
      <text x="24" y="144" fill="#22c55e">$</text>
      <text x="42" y="144" fill="#e2e8f0">values</text>
    </g>
    <g clip-path="url(#t4)">
      <text x="24" y="172" fill="#cbd5e1">ship fast. learn faster. craft over titles. help over hype.</text>
    </g>

    <!-- $ stack -->
    <g clip-path="url(#t5)">
      <text x="24" y="210" fill="#22c55e">$</text>
      <text x="42" y="210" fill="#e2e8f0">stack</text>
    </g>
    <g clip-path="url(#t6)">
      <text x="24" y="238" fill="#cbd5e1">typescript · python · embeddings · agents · MCP · the whole AI stack</text>
    </g>

    <!-- $ looking-for -->
    <g clip-path="url(#t7)">
      <text x="24" y="276" fill="#22c55e">$</text>
      <text x="42" y="276" fill="#e2e8f0">looking-for</text>
    </g>
    <g clip-path="url(#t8)">
      <text x="24" y="304" fill="#cbd5e1">small teams shipping before it's perfect · available may 2026</text>
    </g>
  </g>

  <!-- blinking cursor at end -->
  <rect x="664" y="290" width="9" height="18" fill="#22c55e" opacity="0">
    <animate attributeName="opacity" begin="9.6s" dur="0.01s" values="0;1" fill="freeze"/>
    <animate attributeName="opacity" begin="9.6s" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
