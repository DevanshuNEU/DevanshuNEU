name: 3d contribution graph

on:
  schedule:
    - cron: '12 4 * * *'  # daily at 04:12 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: DevanshuNEU
          MAX_REPOS: 200

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain profile-3d-contrib/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile-3d-contrib/
            git commit -m "refresh 3d contribution chart"
            git push
          else
            echo "no contribution changes"
          fi
